<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nuevo presupuesto</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#101828}
a{color:#1F4FD8;text-decoration:none}a:hover{color:#163BA6}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;font:600 14px/1 Inter,sans-serif;border:1px solid transparent;cursor:pointer;white-space:nowrap;box-sizing:border-box}
.btn-p{background:#1F4FD8;color:#fff}.btn-p:hover{background:#163BA6;color:#fff}
.btn-s{background:#fff;color:#101828;border-color:#D0D5DD}
.btn-g{background:transparent;color:#475467}
.lbl{display:block;font:500 13px/1.3 Inter,sans-serif;color:#344054;margin-bottom:6px}
.inp{box-sizing:border-box;width:100%;height:40px;border:1px solid #D0D5DD;border-radius:10px;padding:0 12px;font:400 14px Inter,sans-serif;color:#101828;background:#fff}
.hint{margin:6px 0 0;font:400 12px/1.4 Inter,sans-serif;color:#667085}
.seg{flex:1;display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px solid #D0D5DD;border-radius:10px;cursor:pointer;background:#fff;text-align:left;font:inherit}
.seg.on{border-color:#1F4FD8;box-shadow:0 0 0 1px #1F4FD8;background:#F5F8FF}
</style>
</helmet>
<div style="width:1440px;height:900px;background:rgba(16,24,40,.45);display:flex;align-items:center;justify-content:center">
  <form role="dialog" aria-labelledby="np-t" style="width:560px;background:#fff;border-radius:16px;box-shadow:0 24px 48px rgba(16,24,40,.24);overflow:hidden" action="#">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;padding:24px 24px 0">
      <div><h2 id="np-t" style="margin:0;font:600 20px/1.3 Inter,sans-serif">Nuevo presupuesto</h2><p style="margin:4px 0 0;font:400 14px Inter,sans-serif;color:#475467">Después cargás la obra y los ítems.</p></div>
      <button class="btn btn-g" type="button" aria-label="Cerrar" style="width:36px;padding:0;justify-content:center"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div style="padding:24px;display:flex;flex-direction:column;gap:20px">
      <div>
        <div style="display:flex;justify-content:space-between;align-items:baseline"><label class="lbl" for="np-c">Cliente</label><a href="#" style="font:600 13px Inter,sans-serif">+ Cliente nuevo</a></div>
        <input class="inp" id="np-c" value="C-00087 · Constructora del Litoral">
      </div>
      <fieldset style="border:0;margin:0;padding:0">
        <legend class="lbl">Material</legend>
        <div style="display:flex;gap:12px">
          <button class="seg on" type="button" aria-pressed="true"><span style="font:600 14px Inter,sans-serif">PVC</span><span style="font:400 12px Inter,sans-serif;color:#475467">Se cotiza en dólares</span></button>
          <button class="seg" type="button" aria-pressed="false"><span style="font:600 14px Inter,sans-serif">Aluminio</span><span style="font:400 12px Inter,sans-serif;color:#475467">Se cotiza en pesos</span></button>
        </div>
      </fieldset>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px">
        <div><label class="lbl" for="np-u">Cotización USD</label><input class="inp" id="np-u" value="$ 1.415,00"><p class="hint">Obligatoria en PVC. Hoy BNA venta.</p></div>
        <div><label class="lbl" for="np-v">Vence el</label><input class="inp" id="np-v" value="28/11/2026"><p class="hint">30 días por defecto.</p></div>
      </div>
      <div><label class="lbl" for="np-n">Notas <span style="font-weight:400;color:#667085">(opcional)</span></label><textarea class="inp" id="np-n" style="height:84px;padding:10px 12px;resize:none">Obra en Paraná, planta baja. Viene de la solicitud del 29/10.</textarea></div>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid #E4E7EC;background:#F9FAFB">
      <button class="btn btn-s" type="button">Cancelar</button>
      <a class="btn btn-p" href="Presupuestos-Detalle.dc.html">Crear y cargar ítems</a>
    </div>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
