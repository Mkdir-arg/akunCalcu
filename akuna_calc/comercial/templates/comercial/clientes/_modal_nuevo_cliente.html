<div id="clienteModal" data-select2-dropdown-parent data-url="{{ url }}" data-target="{{ target }}" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
    <div class="card max-w-2xl w-full max-h-[90vh] overflow-y-auto" style="box-shadow:0 12px 32px rgba(16,24,40,.18)">
        <div class="sticky top-0 bg-white border-b border-line px-6 py-4 flex justify-between items-center" style="border-radius:14px 14px 0 0">
            <h2 class="strong" style="font-size:18px">Nuevo Cliente</h2>
            <button type="button" data-cliente-modal-close class="btn btn-ghost btn-sm btn-icon" aria-label="Cerrar">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <form id="clienteForm" class="p-6 space-y-4" novalidate>
            {% csrf_token %}
            <p class="field-error" data-error-for="__all__"></p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="field">
                <label>Nombre *</label>
                {{ form.nombre }}
                <span class="field-error" data-error-for="nombre"></span>
            </div>
            <div class="field">
                <label>Apellido *</label>
                {{ form.apellido }}
                <span class="field-error" data-error-for="apellido"></span>
            </div>
            </div>
            <div class="field">
                <label>Razón Social</label>
                {{ form.razon_social }}
                <span class="field-error" data-error-for="razon_social"></span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="field">
                <label>CUIT</label>
                {{ form.cuit }}
                <span class="field-error" data-error-for="cuit"></span>
            </div>
            <div class="field">
                <label>DNI</label>
                {{ form.dni }}
                <span class="field-error" data-error-for="dni"></span>
            </div>
            </div>
            <div class="field">
                <label>Condición IVA</label>
                {{ form.condicion_iva }}
                <span class="field-error" data-error-for="condicion_iva"></span>
            </div>
            <div class="field">
                <label>Dirección *</label>
                {{ form.direccion }}
                <span class="field-error" data-error-for="direccion"></span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="field">
                <label>Localidad *</label>
                {{ form.localidad }}
                <span class="field-error" data-error-for="localidad"></span>
            </div>
            <div class="field">
                <label>Provincia</label>
                {{ form.provincia }}
                <span class="field-error" data-error-for="provincia"></span>
            </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="field">
                <label>Teléfono</label>
                {{ form.telefono }}
                <span class="field-error" data-error-for="telefono"></span>
            </div>
            <div class="field">
                <label>Email</label>
                {{ form.email }}
                <span class="field-error" data-error-for="email"></span>
            </div>
            </div>

            <div class="flex justify-end gap-3 pt-4">
                <button type="button" data-cliente-modal-close class="btn btn-secondary">
                    Cancelar
                </button>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save mr-2"></i>Guardar Cliente
                </button>
            </div>
        </form>
    </div>
</div>
