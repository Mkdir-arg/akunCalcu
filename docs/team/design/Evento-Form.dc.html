<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nuevo evento</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#101828}
a{color:#1F4FD8;text-decoration:none}a:hover{color:#163BA6}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;font:600 14px/1 Inter,sans-serif;border:1px solid transparent;cursor:pointer;white-space:nowrap;box-sizing:border-box}
.btn-p{background:#1F4FD8;color:#fff}.btn-p:hover{background:#163BA6;color:#fff}
.btn-s{background:#fff;color:#101828;border-color:#D0D5DD}
.btn-g{background:transparent;color:#475467}
.lbl{display:block;font:500 13px/1.3 Inter,sans-serif;color:#344054;margin-bottom:6px}
.inp{box-sizing:border-box;width:100%;height:40px;border:1px solid #D0D5DD;border-radius:10px;padding:0 12px;font:400 14px Inter,sans-serif;color:#101828;background:#fff}
.hint{margin:6px 0 0;font:400 12px/1.4 Inter,sans-serif;color:#667085}
.seg{flex:1;display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px solid #D0D5DD;border-radius:10px;cursor:pointer;background:#fff;text-align:left;font:inherit}
.seg.on{border-color:#1F4FD8;box-shadow:0 0 0 1px #1F4FD8;background:#F5F8FF}

.lbl{display:block;font:500 13px/1.3 Inter,sans-serif;color:#344054;margin-bottom:6px}
.hint{margin:6px 0 0;font:400 12px/1.4 Inter,sans-serif;color:#667085}
select.inp{appearance:auto}
textarea.inp{height:auto;padding:10px 12px;resize:none;line-height:1.45}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid #D0D5DD;background:#fff;color:#344054;font:500 13px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.chip:hover{background:#F9FAFB}
.chip.on{background:#EEF3FF;border-color:#B2CCFF;color:#1F4FD8;font-weight:600}
.back{display:inline-flex;align-items:center;gap:6px;font:500 14px Inter,sans-serif;color:#475467}
.back:hover{color:#101828}
.back svg{width:16px;height:16px}
.sec-t{margin:0 0 16px;font:600 16px/1.3 Inter,sans-serif;color:#101828}
.kv dt{font:500 12px Inter,sans-serif;color:#667085;margin:0 0 4px}
.kv dd{margin:0 0 16px;font:500 14px/1.4 Inter,sans-serif;color:#101828}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.tfoot td{background:#F9FAFB;font-weight:700;color:#101828;border-top:1px solid #E4E7EC}
.toggle{display:inline-flex;align-items:center;gap:10px;font:500 14px Inter,sans-serif;color:#344054}
.toggle input{width:18px;height:18px;accent-color:#1F4FD8}
</style>
</helmet>
<div style="width:1440px;height:900px;background:rgba(16,24,40,.45);display:flex;align-items:center;justify-content:center">
  <form role="dialog" aria-labelledby="ev-t" style="width:600px;background:#fff;border-radius:16px;box-shadow:0 24px 48px rgba(16,24,40,.24);overflow:hidden" action="#">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;padding:24px 24px 0">
      <div><h2 id="ev-t" style="margin:0;font:600 20px/1.3 Inter,sans-serif">Nuevo evento</h2><p style="margin:4px 0 0;font:400 14px Inter,sans-serif;color:#475467">Aparece en la agenda del equipo.</p></div>
      <button class="btn btn-g" type="button" aria-label="Cerrar" style="width:36px;padding:0;justify-content:center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:18px;height:18px"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div style="padding:24px;display:flex;flex-direction:column;gap:18px">
      <div><label class="lbl" for="ev-ti">Título <span style="color:#B42318">*</span></label><input class="inp" id="ev-ti" type="text" value="Medición en obra"></div>
      <div class="g2">
        <div><label class="lbl" for="ev-tp">Tipo de evento</label><select class="inp" id="ev-tp"><option selected>Medición</option><option>Colocación</option><option>Servicio técnico</option><option>Llamar</option><option>Pendiente</option></select></div>
        <div><label class="lbl" for="ev-cl">Cliente</label><input class="inp" id="ev-cl" type="text" value="C-00087 · Constructora del Litoral"></div>
      </div>
      <div class="g3">
        <div><label class="lbl" for="ev-fe">Fecha <span style="color:#B42318">*</span></label><input class="inp" id="ev-fe" type="text" value="13/10/2026"></div>
        <div><label class="lbl" for="ev-ho">Hora</label><input class="inp" id="ev-ho" type="text" value="11:00"></div>
        <div><label class="lbl" for="ev-re">Responsable</label><select class="inp" id="ev-re"><option selected>Ramiro</option><option>Lucía</option><option>Pablo</option></select></div>
      </div>
      <div><label class="lbl" for="ev-di">Dirección</label><input class="inp" id="ev-di" type="text" value="Av. Costanera 1450, Paraná"></div>
      <div><label class="lbl" for="ev-no">Notas</label><textarea class="inp" id="ev-no" rows="3">Llevar planilla de medidas. Confirmar con el encargado el día anterior.</textarea></div>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid #E4E7EC;background:#F9FAFB">
      <button class="btn btn-s" type="button">Cancelar</button>
      <button class="btn btn-p" type="submit">Guardar evento</button>
    </div>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
