{% extends 'core/base.html' %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="page-head"><div><h1 class="page-title">{{ titulo }}</h1>
    </div></div>

    <div class="card card-pad">
        <form method="post">
            {% csrf_token %}
            <div class="grid grid-cols-1 gap-6">
                {% for field in form %}
                <div class="field">
                    <label>{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <p class="field-error">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
                {% endfor %}
            </div>
            <div class="flex justify-end gap-3 mt-6 pt-4" style="border-top:1px solid var(--line)">
                <a href="{% url 'config-extrusoras' %}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i>Guardar
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
