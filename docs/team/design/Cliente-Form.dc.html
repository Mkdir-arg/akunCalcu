body{margin:0;background:#F4F5F7;font-family:Inter,system-ui,sans-serif;color:#101828;font-feature-settings:"tnum" 1}
a{color:#1F4FD8;text-decoration:none}a:hover{color:#163BA6}

.b-gray{background:#F2F4F7;color:#344054}.b-blue{background:#EEF3FF;color:#1F4FD8}.b-green{background:#ECFDF3;color:#067647}.b-amber{background:#FFFAEB;color:#B54708}.b-red{background:#FEF3F2;color:#B42318}.b-violet{background:#F4F3FF;color:#5925DC}

.tab{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:8px;font:500 14px Inter,sans-serif;color:#475467}
.tab:hover{background:#fff;color:#101828}

.cnt{font:600 12px Inter,sans-serif;color:#667085;background:#F2F4F7;border-radius:999px;padding:2px 8px}

.hint{margin:6px 0 0;font:400 12px/1.4 Inter,sans-serif;color:#667085}
.sec{margin:0 0 12px;font:600 12px/1 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#667085}
.chip{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:999px;border:1px solid #D0D5DD;font:500 13px Inter,sans-serif;color:#344054;background:#fff;cursor:pointer}
.chip.on{border-color:#1F4FD8;background:#EEF3FF;color:#1F4FD8;font-weight:600}
.dl{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #F2F4F7;font:400 13px/1.4 Inter,sans-serif;color:#344054}
.dl span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.seg{flex:1;display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px solid #D0D5DD;border-radius:10px;cursor:pointer;background:#fff;text-align:left;font:inherit}
.seg.on{border-color:#1F4FD8;box-shadow:0 0 0 1px #1F4FD8;background:#F5F8FF}
.kpi-l{margin:0;font:600 12px/1 Inter,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:#667085}
.kpi-v{margin:8px 0 0;font:600 26px/1.1 Inter,sans-serif;letter-spacing:-.02em;color:#101828}
.kpi-s{margin:6px 0 0;font:400 13px/1.3 Inter,sans-serif;color:#475467}
.h2{margin:0;font:600 16px/1.3 Inter,sans-serif;color:#101828}
.chk{display:flex;gap:8px;align-items:center;font:400 14px Inter,sans-serif;color:#344054}
.chk input{accent-color:#1F4FD8;width:16px;height:16px;margin:0}
.bar{height:8px;border-radius:999px;background:#EAECF0;overflow:hidden}
.bar span{display:block;height:100%;background:#1F4FD8;border-radius:999px}
.tbl tfoot td{background:#F9FAFB;font-weight:600;color:#101828;border-top:1px solid #E4E7EC}
select.inp{appearance:auto}
</style>
