{% extends 'core/base.html' %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="page-head"><div><h1 class="page-title">{{ titulo }}</h1>
    </div></div>

    <div class="card card-pad">
        <form method="post">
            {% csrf_token %}
            <div class="grid grid-cols-1 gap-6">
                {% for field in form %}
                <div class="field">
                    <label>{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <p class="field-error">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
                {% endfor %}
            </div>
            <div class="flex justify-end gap-3 mt-6 pt-4" style="border-top:1px solid var(--line)">
                <a href="{% url 'config-productos' %}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i>Guardar
                </button>
            </div>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const extrusoraSelect = document.getElementById('id_extrusora');
    const lineaSelect = document.getElementById('id_linea');
    if (!extrusoraSelect || !lineaSelect) return;
    const emptyOption = '<option value="">---------</option>';

    // El <select> de Línea está envuelto por Select2 (base.html lo aplica a todos
    // los <select>). Al rellenar la Línea por JS modificamos el <select> nativo, pero
    // el widget de Select2 no se entera: hay que reconstruirlo o queda vacío/bloqueado.
    function syncSelect2(selectEl) {
        if (typeof window.reinitAkunSelect2 === 'function') {
            window.reinitAkunSelect2(selectEl);
        }
    }

    function resetSelect(selectEl, disabled = true) {
        selectEl.innerHTML = emptyOption;
        selectEl.disabled = disabled;
        syncSelect2(selectEl);
    }

    function populateSelect(selectEl, items, textKey, selectedId) {
        selectEl.innerHTML = emptyOption;
        items.forEach(item => {
            const option = document.createElement('option');
            option.value = item.id;
            option.textContent = item[textKey] || `ID ${item.id}`;
            if (selectedId && String(item.id) === String(selectedId)) option.selected = true;
            selectEl.appendChild(option);
        });
        selectEl.disabled = items.length === 0;
        syncSelect2(selectEl);
    }

    async function cargarLineas(extrusoraId, selectedLineaId) {
        resetSelect(lineaSelect, true);
        if (!extrusoraId) return;
        try {
            const data = await fetch(`/pricing/api/pricing/lineas/?extrusora_id=${extrusoraId}`).then(r => r.json());
            populateSelect(lineaSelect, data, 'nombre', selectedLineaId);
        } catch (e) {
            console.error('Error cargando líneas:', e);
        }
    }

    {% if object %}
    // Modo edición: linea ya está server-rendered con el valor correcto, solo habilitarla
    if (lineaSelect.options.length > 1) {
        lineaSelect.disabled = false;
        syncSelect2(lineaSelect);
    }
    {% else %}
    // Modo creación: deshabilitar linea hasta que se seleccione extrusora
    resetSelect(lineaSelect, true);
    {% endif %}

    // Select2 (base.html lo aplica a todos los <select>) dispara el evento 'change'
    // vía jQuery .trigger(), que NO ejecuta los listeners addEventListener nativos.
    // Por eso bindeamos con jQuery: capta tanto el change nativo como el de Select2.
    if (window.jQuery) {
        window.jQuery(extrusoraSelect).on('change', function() { cargarLineas(this.value); });
    } else {
        extrusoraSelect.addEventListener('change', function() { cargarLineas(this.value); });
    }
});
</script>
{% endblock %}
